<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Citylife — LifeAfterLogic</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#777b70;color:#eee;font:12px/1.4 system-ui,sans-serif}canvas{width:100%;height:100%;display:block;touch-action:manipulation}header,footer{position:fixed;left:0;right:0;padding:18px 24px;display:flex;justify-content:space-between;gap:12px;align-items:center;pointer-events:none;text-shadow:0 1px 5px #222}header{top:0}footer{bottom:0;align-items:end}strong{font-size:15px;letter-spacing:.10em}small{display:block;font-size:11px}button,select,a{pointer-events:auto}button,select{background:#242824b8;color:#fff;border:1px solid #ffffff69;padding:6px 10px;border-radius:2px;font:inherit}button{cursor:pointer}a{color:inherit}#controls{display:flex;align-items:center;gap:6px}header{background:linear-gradient(#2225,transparent)}footer{background:linear-gradient(transparent,#2225)}@media(max-width:600px){header,footer{padding:12px}footer{flex-wrap:wrap}small{font-size:10px}}
</style></head><body>
<canvas id="city" aria-label="Autonomous evolving oblique city"></canvas>
<header><div><strong>CITYLIFE</strong><small>LifeAfterLogic / experiment 002</small></div><small>Autonomous urban organism</small></header>
<footer><div><small id="stats">Constructing city…</small><small>Tap the city to introduce a local disturbance.</small><small><a href="https://commons.wikimedia.org/wiki/File:Sham_shui_po_day01.JPG" target="_blank" rel="noopener">Photographic reference: J. Carmichael / public domain</a></small></div><div id="controls"><select id="speed" aria-label="Simulation speed"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select><button id="pause">Pause</button><button id="reset">New city</button></div></footer>
<script src="city.js"></script></body></html>
